name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v8.4.23, v7.2.15, etc.
      - '[0-9]+.[0-9]+.[0-9]+*'  # Also supports tags like 8.4.23, 7.2.15, etc.

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to create releases and upload assets
      id-token: write  # Required for OIDC if using
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for changelog extraction
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
      
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag format: v8.4.23 -> 8.4.23
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Tag format: 8.4.23 -> 8.4.23
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"
      
      - name: Determine Gradle version from tag
        id: gradle_version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract major.minor from version (e.g., 8.4.23 -> 8.4)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          
          # Deployable Gradle versions (must match deploy: true in CI workflow matrix)
          # This is the single source of truth for which Gradle versions can be used for releases
          DEPLOYABLE_VERSIONS="7.6 8.4"
          
          # Map to Gradle version based on SetupBuilder version
          # Based on SetupBuilderVersion.gradle logic:
          # - 8.4.x -> Gradle 8.4 (deploy: true in CI)
          # - 7.2.x -> Gradle 7.6 (deploy: true in CI)
          # - < 7.2 -> Gradle 7.6 (fallback)
          if [ "$MAJOR" -gt 8 ] || ([ "$MAJOR" -eq 8 ] && [ "$MINOR" -ge 4 ]); then
            GRADLE_VERSION="8.4"
          elif [ "$MAJOR" -gt 7 ] || ([ "$MAJOR" -eq 7 ] && [ "$MINOR" -ge 2 ]); then
            GRADLE_VERSION="7.6"
          else
            GRADLE_VERSION="7.6"  # Default fallback
          fi
          
          # Validate that we're using a deployable Gradle version
          # (matches deploy: true versions in CI workflow)
          if ! echo "$DEPLOYABLE_VERSIONS" | grep -q "\b$GRADLE_VERSION\b"; then
            echo "::error::Gradle version $GRADLE_VERSION is not deployable. Deployable versions: $DEPLOYABLE_VERSIONS"
            exit 1
          fi
          
          echo "gradle_version=$GRADLE_VERSION" >> $GITHUB_OUTPUT
          echo "Using Gradle version: $GRADLE_VERSION for SetupBuilder $VERSION (deployable version)"
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: ${{ steps.gradle_version.outputs.gradle_version }}
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ steps.gradle_version.outputs.gradle_version }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ steps.gradle_version.outputs.gradle_version }}-
            ${{ runner.os }}-gradle-
      
      - name: Set environment variables
        run: |
          echo "LIB_GRADLE_VERSION=${{ steps.gradle_version.outputs.gradle_version }}" >> $GITHUB_ENV
      
      - name: Update version in gradle.properties
        run: |
          # Remove -SNAPSHOT suffix if present, ensure version matches tag
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = .*/version = ${VERSION}/" gradle.properties
          cat gradle.properties
      
      - name: Run Gradle wrapper
        run: gradle wrapper
      
      - name: Build plugin
        run: ./gradlew clean build -x test --no-daemon
      
      - name: Validate plugin
        run: ./gradlew validatePlugins --no-daemon
      
      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Extracting changelog for version: $VERSION"
          
          # Try to extract changelog section for this version
          # Look for version in CHANGELOG.md or readme.md
          CHANGELOG=""
          
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG=$(awk -v version="$VERSION" '
              BEGIN { found=0; in_section=0 }
              /^# / || /^## / {
                if (in_section) exit
                if ($0 ~ "^# " version "$" || $0 ~ "^# " version " " || 
                    $0 ~ "^## " version "$" || $0 ~ "^## " version " ") {
                  found=1
                  in_section=1
                  next
                }
              }
              in_section { print }
            ' CHANGELOG.md)
          fi
          
          # If empty, use a default message
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release version $VERSION"
          fi
          
          # Escape for GitHub output (multiline)
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          
          echo "Changelog extracted (first 200 chars):"
          echo "$CHANGELOG" | head -c 200
          echo ""
      
      - name: Publish to Maven Central (Sonatype)
        continue-on-error: true
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishToSonatype closeStagingRepositories --no-daemon \
            -Psigning.key="$SIGNING_KEY" \
            -Psigning.password="$SIGNING_PASSWORD"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Version ${{ steps.version.outputs.version }}
            
            ${{ steps.changelog.outputs.changelog }}
            
            ---
            
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.ref }}
          files: |
            build/libs/SetupBuilder-*.jar
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Publish to Gradle Plugin Portal
        continue-on-error: true
        env:
          gradlePublishKey: ${{ secrets.GRADLE_PUBLISH_KEY }}
          gradlePublishSecret: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishPlugin --no-daemon \
            -Psigning.key="$SIGNING_KEY" \
            -Psigning.password="$SIGNING_PASSWORD"

