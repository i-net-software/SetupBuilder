name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build and Test (${{ matrix.os }}, Gradle ${{ matrix.gradle-version }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          # Deployable Gradle versions (deploy: true) - these are the ONLY versions that:
          # 1. Publish snapshots to Sonatype
          # 2. Upload build artifacts
          # 3. Can be used for releases (see release.yml for validation)
          # 
          # To add a new deployable version:
          # 1. Add it here with deploy: true
          # 2. Update DEPLOYABLE_VERSIONS in release.yml
          # 3. Update the version mapping logic in release.yml if needed
          - os: ubuntu-latest
            gradle-version: '7.6'
            deploy: true  # Stable: Used for SetupBuilder 7.2.x releases
          - os: ubuntu-latest
            gradle-version: '8.4'
            deploy: true  # Stable: Used for SetupBuilder 8.4.x releases
          
          # Test-only versions (deploy: false) - for compatibility testing, not releases
          - os: ubuntu-latest
            gradle-version: '8.14.2'
            deploy: false  # Test-only: Newer 8.x version
          - os: ubuntu-latest
            gradle-version: '9.2.1'
            deploy: false  # Test-only: Future Gradle 9 support
          - os: windows-latest
            gradle-version: '8.4'
            deploy: false  # Cross-platform testing only
          - os: macos-latest
            gradle-version: '8.4'
            deploy: false  # Cross-platform testing only
          - os: macos-latest
            gradle-version: '9.2.1'
            deploy: false  # Cross-platform testing only
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
      
      - name: Setup Gradle ${{ matrix.gradle-version }}
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: ${{ matrix.gradle-version }}
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.gradle-version }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.gradle-version }}-
            ${{ runner.os }}-gradle-
      
      - name: Set Gradle version environment variable
        run: |
          echo "LIB_GRADLE_VERSION=${{ matrix.gradle-version }}" >> $GITHUB_ENV
      
      - name: Run Gradle wrapper
        run: gradle wrapper
        shell: bash
      
      - name: Build plugin
        run: ./gradlew clean build -x test --no-daemon
        shell: bash
      
      - name: Run tests
        run: ./gradlew check --no-daemon
        shell: bash
      
      - name: Validate plugin
        run: ./gradlew validatePlugins --no-daemon
        shell: bash
      
      - name: Publish snapshot to Sonatype
        if: matrix.deploy == 'true' && github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishToSonatype --no-daemon \
            -Psigning.key="$SIGNING_KEY" \
            -Psigning.password="$SIGNING_PASSWORD"
        shell: bash
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-gradle${{ matrix.gradle-version }}
          path: build/test-results/
          retention-days: 7
      
      - name: Upload build artifacts
        if: matrix.deploy == 'true' && matrix.gradle-version == '8.4' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/*.jar
          retention-days: 1

