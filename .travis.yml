language: groovy
jdk:
- openjdk17
env:
  matrix:
  - LIB_GRADLE_VERSION=7.6 DEPLOY=true
  - LIB_GRADLE_VERSION=8.4 DEPLOY=true
  - LIB_GRADLE_VERSION=8.14.2
  - LIB_GRADLE_VERSION=9.0.0-milestone-9
  global:
    # The next declaration is the encrypted gradlePublishKey
  - secure: 
    # The next declaration is the encrypted gradlePublishSecret
  - secure: 
before_install:
- echo $TRAVIS_TAG
- sudo apt-get -qq update
- sudo apt-get install -y fakeroot
install:
  - gradle wrapper
  # upload to '../repo'
  - "./gradlew publish"
deploy:
  provider: releases
  token: $GITHUB_TOKEN
  file_glob: true
  file: "./build/libs/SetupBuilder-*"
  skip_cleanup: true
  overwrite: true
  on:
    repo: i-net-software/SetupBuilder
    tags: true
    condition: $DEPLOY = true
after_deploy:
  - "./gradlew publishPlugin"
